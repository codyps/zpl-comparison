[package]
name = "zpl-comparison"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
codyps-zpl = { package = "zpl", path = "../../_work/zpl/zpl", optional = true }
toolchain = { package = "zpl_toolchain_core", version = "=0.4.1", optional = true }
labelize = { version = "=1.5.0", optional = true }
forge = { package = "zpl-forge", version = "=0.3.2", default-features = false, features = [
    "png",
], optional = true }
builder = { package = "zpl-builder", version = "=0.1.0", optional = true }
ffi = { package = "zpl-rs", version = "=0.1.8", optional = true }

[[bin]]
name = "codyps-zpl"
path = "src/main.rs"
required-features = ["codyps-zpl"]

[[bin]]
name = "toolchain"
path = "src/main.rs"
required-features = ["toolchain"]

[[bin]]
name = "labelize"
path = "src/main.rs"
required-features = ["labelize"]

[[bin]]
name = "forge"
path = "src/main.rs"
required-features = ["forge"]

[[bin]]
name = "builder"
path = "src/main.rs"
required-features = ["builder"]

[[bin]]
name = "ffi"
path = "src/main.rs"
required-features = ["ffi"]

[profile.release]
strip = true
