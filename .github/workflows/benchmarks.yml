name: Generated reports

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generated-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: generated-reports
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Read pinned private source revision
        if: github.event.pull_request.head.repo.fork != true
        id: source
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("benchmarks/sources.lock.json"))["zpl"]["rev"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event.pull_request.head.repo.fork != true
        with:
          repository: codyps/zpl
          ref: ${{ steps.source.outputs.revision }}
          token: ${{ secrets.ZPL_SOURCE_TOKEN }}
          path: benchmarks/_work/zpl
          persist-credentials: false
      - name: Test publication and report runner
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bazel test //:report_runner_test //:pipeline_test --test_output=errors
      - name: Build libraries, local renders, and reports
        if: github.event.pull_request.head.repo.fork != true
        run: bazel build //:reports --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" --jobs=4
      - name: Verify independent cache boundaries
        if: github.event.pull_request.head.repo.fork != true
        run: |
          bazel aquery 'mnemonic("Zpl(Render|Compare|LibraryBuild)", deps(//:reports))' \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" \
            --output=jsonproto --include_commandline=false > "$RUNNER_TEMP/actions.json"
          python3 build/check_action_graph.py "$RUNNER_TEMP/actions.json"
      - name: Reproduce saved reports for fork pull requests
        if: github.event.pull_request.head.repo.fork == true
        run: bazel build //:reports_saved
      - name: Package report tree
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -C bazel-bin/reports -czf "$RUNNER_TEMP/reports.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: generated-reports
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-generated-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-reports
          path: ${{ runner.temp }}/report-artifact
      - name: Publish independent generated branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir "$RUNNER_TEMP/report-tree"
          tar -xzf "$RUNNER_TEMP/report-artifact/reports.tar.gz" -C "$RUNNER_TEMP/report-tree"
          python3 .github/scripts/publish_reports.py \
            --output "$RUNNER_TEMP/report-tree" \
            --source-sha "$SOURCE_SHA" \
            --run-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
