name: Comparison site

on:
  workflow_dispatch:
    inputs:
      action_cache_snapshot:
        description: Restore/save the disk action cache for timing comparisons
        type: boolean
        default: false
      report_jobs:
        description: Concurrent report actions (local CPU use remains capped)
        type: choice
        options: ['64', '32']
        default: '64'
  schedule:
    - cron: "23 8 * * *"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generated-reports-${{ github.ref }}
  # Let main finish publication; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Language toolchains are pinned by Bazel; these are their host dependencies.
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            zlib1g-dev unzip zip python3
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          # BuildBuddy shares action results across trusted runs. Runs without
          # credentials retain the rolling snapshot fallback below.
          disk-cache: false
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - build/toolchains.lock.json
            - build/requirements.lock.txt
          cache-save: ${{ github.event.pull_request.head.repo.fork != true }}
      - name: Configure Bazel caches
        id: cache-config
        env:
          # Only trusted main builds receive remote-cache write credentials.
          BUILDBUDDY_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.BUILDBUDDY_API_KEY || '' }}
        run: python3 .github/scripts/buildbuddy_cache.py configure
      - name: Restore Bazel action cache
        if: steps.cache-config.outputs.remote-enabled != 'true' || inputs.action_cache_snapshot == true
        id: action-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.disk-cache }}
          key: bazel-actions-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-actions-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-
            setup-bazel-1-linux-x64-disk-true-
      - name: Verify BuildBuddy cache round trip
        if: steps.cache-config.outputs.remote-enabled == 'true'
        timeout-minutes: 3
        run: python3 .github/scripts/verify_buildbuddy_cache.py
      - name: Read pinned private source revision
        if: github.event.pull_request.head.repo.fork != true
        id: source
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("benchmarks/sources.lock.json"))["zpl"]["rev"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.head.repo.fork != true
        with:
          repository: codyps/zpl
          ref: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main' || steps.source.outputs.revision }}
          token: ${{ secrets.ZPL_SOURCE_TOKEN }}
          path: benchmarks/_work/zpl
          persist-credentials: false
      - name: Resolve latest ZPL main for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 .github/scripts/refresh_zpl_source.py
      - name: Retain resolved source and dependency pins
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-source-pins
          path: |
            benchmarks/sources.lock.json
            benchmarks/adapters/rust/Cargo.lock
      - name: Test publication and report runner
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest benchmarks.test_audit_failures
          bazel test //:site_test //:report_runner_test //:report_archive_test //:pipeline_test //:automation_test //:overview_test //:performance_test //:renderer_session_test --test_output=errors
      # Let tests, reports, and benchmarks request their own library inputs.
      # Native actions carry CPU/memory reservations for cold-cache builds.
      - name: Test native adapter contracts
        if: github.event.pull_request.head.repo.fork != true
        run: |
          bazel test //:canvas_profile_test //:node_adapter_test //:adapter_contract_test //:support_test //:font_profile_test //:font_capture_test //:renderer_reuse_test \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" --jobs=2 --test_output=errors
      - name: Build local renders and reports
        if: github.event.pull_request.head.repo.fork != true
        timeout-minutes: 45
        env:
          REPORT_JOBS: ${{ inputs.report_jobs || '64' }}
        run: |
          bazel build //:reports //:reports_fonts \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" \
            --jobs="$REPORT_JOBS" --local_resources=cpu=HOST_CPUS \
            --profile="$RUNNER_TEMP/reports.profile.gz" \
            --execution_log_compact_file="$RUNNER_TEMP/reports.exec.zst" \
            --build_event_json_file="$RUNNER_TEMP/reports.events.json"
      - name: Test generated compatibility evidence
        if: github.event.pull_request.head.repo.fork != true
        env:
          PYTHONPATH: benchmarks
        run: ZPL_REPORTS_PATH="$GITHUB_WORKSPACE/bazel-bin/reports" python3 -m unittest benchmarks.test_compatibility
      - name: Save updated Bazel action cache
        if: always() && !cancelled() && github.event.pull_request.head.repo.fork != true && steps.action-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.disk-cache }}
          key: ${{ steps.action-cache.outputs.cache-primary-key }}
      - name: Upload build performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-performance
          path: |
            ${{ runner.temp }}/*.profile.gz
            ${{ runner.temp }}/*.events.json
            ${{ runner.temp }}/*.exec.zst
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify independent cache boundaries
        if: github.event.pull_request.head.repo.fork != true
        run: |
          bazel aquery 'mnemonic("Zpl(Render|Compare|LibraryBuild)", deps(//:reports))' \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" \
            --output=jsonproto --include_commandline=false > "$RUNNER_TEMP/actions.json"
          python3 build/check_action_graph.py "$RUNNER_TEMP/actions.json" test-data/layout-accuracy/manifest.json
      - name: Reproduce saved reports for fork pull requests
        if: github.event.pull_request.head.repo.fork == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/fetch_baseline.py --repository "$GH_REPO" --output "$RUNNER_TEMP/baseline.lock.json"
          bazel build //:reports_saved --repo_env=ZPL_BASELINE_LOCK="$RUNNER_TEMP/baseline.lock.json"
          bazel aquery 'mnemonic("Zpl(Saved|Render|Compare|LibraryBuild|Reports)", deps(//:reports_saved))' \
            --repo_env=ZPL_BASELINE_LOCK="$RUNNER_TEMP/baseline.lock.json" \
            --output=jsonproto --include_commandline=false > "$RUNNER_TEMP/saved-actions.json"
          python3 build/check_action_graph.py "$RUNNER_TEMP/saved-actions.json" test-data/layout-accuracy/manifest.json --saved
      - name: Measure renderer performance (uncached)
        if: github.event.pull_request.head.repo.fork != true
        timeout-minutes: 15
        run: |
          bazel run //:performance \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" -- \
            --libraries "$GITHUB_WORKSPACE/bazel-bin" \
            --fixtures "$GITHUB_WORKSPACE/benchmarks/fixtures" \
            --output "$RUNNER_TEMP/performance"
      - name: Upload measured performance evidence
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-performance
          path: ${{ runner.temp }}/performance
          if-no-files-found: error
          retention-days: 30
      - name: Collect current public repository metadata
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect_popularity.py --output "$RUNNER_TEMP/popularity.json"
      - name: Restore site previews
        id: preview-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/site-previews
          key: site-previews-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-previews-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate and validate comparison site
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            bazel run //:comparison_site -- --input "$GITHUB_WORKSPACE/bazel-bin/reports_saved" --output "$GITHUB_WORKSPACE/_site" --preview-cache "$RUNNER_TEMP/site-previews"
          else
            # Stage a writable tree; never modify cached Bazel outputs.
            cp -RL bazel-bin/reports "$RUNNER_TEMP/measured-reports"
            chmod -R u+w "$RUNNER_TEMP/measured-reports"
            cp -R "$RUNNER_TEMP/performance/." "$RUNNER_TEMP/measured-reports/docs/benchmarks/"
            if [ -f "$RUNNER_TEMP/popularity.json" ]; then
              cp "$RUNNER_TEMP/popularity.json" "$RUNNER_TEMP/measured-reports/benchmarks/popularity.json"
              python3 benchmarks/catalog.py --popularity "$RUNNER_TEMP/popularity.json" --output "$RUNNER_TEMP/measured-reports/docs/benchmarks/capabilities.md"
            fi
            bazel run //:comparison_site -- --input "$RUNNER_TEMP/measured-reports" --font-input "$GITHUB_WORKSPACE/bazel-bin/reports_fonts" --output "$GITHUB_WORKSPACE/_site" --preview-cache "$RUNNER_TEMP/site-previews"
          fi
      - name: Save site previews
        if: success() && github.event.pull_request.head.repo.fork != true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/site-previews
          key: ${{ steps.preview-cache.outputs.cache-primary-key }}
      - name: Export durable observations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir "$RUNNER_TEMP/observation-bundle"
          python3 build/baseline.py --source "$RUNNER_TEMP/measured-reports" --export \
            --output "$RUNNER_TEMP/observation-bundle/observations.tar.gz" --revision "$GITHUB_SHA"
      - name: Transfer observations to publication job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observation-bundle
          path: ${{ runner.temp }}/observation-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Upload comparison site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-site-preview
          path: _site
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish-observations:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retain immutable observation bundle as release assets
        run: |
          gh run download "$GITHUB_RUN_ID" --name observation-bundle --dir bundle
          tag="ci-observations-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" bundle/observations.tar.gz bundle/observations.tar.gz.json \
            --target "$GITHUB_SHA" --title "CI observations $GITHUB_SHA" \
            --notes "Hash-verified renderer observations from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Retained for fork and offline replay." \
            --prerelease --latest=false

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: comparison-site-pages
      cancel-in-progress: false
    steps:
      - name: Deploy comparison site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
