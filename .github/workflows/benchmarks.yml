name: Generated reports

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generated-reports-${{ github.ref }}
  # Let main finish its cache checkpoint; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: warbler-linux
    timeout-minutes: 60
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Language toolchains are pinned by Bazel; these are their host dependencies.
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libicu74 zlib1g-dev unzip zip python3
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: build --disk_cache=${{ runner.temp }}/bazel-disk
      - name: Restore rolling action cache
        id: action-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-disk
          # GitHub caches are immutable. Always save new actions, even when only
          # fixture bytes changed and BUILD/MODULE files stayed the same.
          key: zpl-actions-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-reports
          restore-keys: |
            zpl-actions-v2-${{ runner.os }}-${{ runner.arch }}-
            setup-bazel-1-linux-x64-disk-generated-reports-
      - name: Read pinned private source revision
        if: github.event.pull_request.head.repo.fork != true
        id: source
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("benchmarks/sources.lock.json"))["zpl"]["rev"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.head.repo.fork != true
        with:
          repository: codyps/zpl
          ref: ${{ steps.source.outputs.revision }}
          token: ${{ secrets.ZPL_SOURCE_TOKEN }}
          path: benchmarks/_work/zpl
          persist-credentials: false
      - name: Test publication and report runner
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bazel test //:report_runner_test //:pipeline_test //:overview_test --test_output=errors
      - name: Build pinned renderer libraries
        if: github.event.pull_request.head.repo.fork != true
        timeout-minutes: 20
        run: |
          bazel build //:render_libraries \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" --jobs=2 \
            --profile="$RUNNER_TEMP/libraries.profile.gz" \
            --build_event_json_file="$RUNNER_TEMP/libraries.events.json"
      - name: Checkpoint compiled libraries
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-disk
          key: zpl-actions-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-libraries
      - name: Build local renders and reports
        if: github.event.pull_request.head.repo.fork != true
        timeout-minutes: 30
        run: |
          bazel build //:reports \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" --jobs=4 \
            --profile="$RUNNER_TEMP/reports.profile.gz" \
            --build_event_json_file="$RUNNER_TEMP/reports.events.json"
      - name: Save completed action cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-disk
          key: ${{ steps.action-cache.outputs.cache-primary-key }}
      - name: Upload build performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-performance
          path: |
            ${{ runner.temp }}/*.profile.gz
            ${{ runner.temp }}/*.events.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify independent cache boundaries
        if: github.event.pull_request.head.repo.fork != true
        run: |
          bazel aquery 'mnemonic("Zpl(Render|Compare|LibraryBuild)", deps(//:reports))' \
            --repo_env=ZPL_SOURCE_PATH="$GITHUB_WORKSPACE/benchmarks/_work/zpl" \
            --output=jsonproto --include_commandline=false > "$RUNNER_TEMP/actions.json"
          python3 build/check_action_graph.py "$RUNNER_TEMP/actions.json" test-data/layout-accuracy/manifest.json
      - name: Reproduce saved reports for fork pull requests
        if: github.event.pull_request.head.repo.fork == true
        run: |
          bazel build //:reports_saved
          bazel aquery 'mnemonic("Zpl(Saved|Render|Compare|LibraryBuild|Reports)", deps(//:reports_saved))' \
            --output=jsonproto --include_commandline=false > "$RUNNER_TEMP/saved-actions.json"
          python3 build/check_action_graph.py "$RUNNER_TEMP/saved-actions.json" test-data/layout-accuracy/manifest.json --saved
      - name: Package report tree
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -C bazel-bin/reports -czf "$RUNNER_TEMP/reports.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: generated-reports
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: warbler-linux
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-generated-reports
      cancel-in-progress: false
    steps:
      - name: Install checkout dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-reports
          path: ${{ runner.temp }}/report-artifact
      - name: Publish independent generated branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir "$RUNNER_TEMP/report-tree"
          tar -xzf "$RUNNER_TEMP/report-artifact/reports.tar.gz" -C "$RUNNER_TEMP/report-tree"
          python3 .github/scripts/publish_reports.py \
            --output "$RUNNER_TEMP/report-tree" \
            --source-sha "$SOURCE_SHA" \
            --run-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
