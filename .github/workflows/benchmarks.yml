name: Library comparison

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: library-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MPLCONFIGDIR: ${{ github.workspace }}/benchmarks/_work/matplotlib
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read pinned ZPL revision
        id: zpl-source
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print("revision=" + json.loads(Path("benchmarks/sources.lock.json").read_text())["zpl"]["rev"])
          PYCODE
      - name: Checkout private ZPL source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: codyps/zpl
          ref: ${{ steps.zpl-source.outputs.revision }}
          path: benchmarks/_work/zpl
          token: ${{ secrets.ZPL_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.0'
      - name: Install plotting and image verification tools
        run: |
          python -m venv benchmarks/_work/venv
          benchmarks/_work/venv/bin/pip install -r benchmarks/requirements.txt
      - name: Verify generated rendering corpus
        run: |
          python test-data/render-conformance/generate.py --check
          python test-data/invalid-zpl/generate.py --check
          python benchmarks/compatibility.py --check
          benchmarks/_work/venv/bin/python benchmarks/labelary.py --check
      - name: Build locked adapters
        run: benchmarks/_work/venv/bin/python benchmarks/prepare.py
      - name: Inventory command support
        run: benchmarks/_work/venv/bin/python benchmarks/support.py
      - name: Verify harness
        run: benchmarks/_work/venv/bin/python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Measure serially and generate Markdown
        id: measure
        run: benchmarks/_work/venv/bin/python benchmarks/run.py
      - name: Compare printer accuracy offline
        id: accuracy
        run: benchmarks/_work/venv/bin/python benchmarks/accuracy/run.py
      - name: Verify comparison pages and images
        run: benchmarks/_work/venv/bin/python benchmarks/accuracy/gallery.py docs/benchmarks/accuracy --check
      - name: Compare invalid-ZPL rejection
        id: invalid
        continue-on-error: true
        run: benchmarks/_work/venv/bin/python benchmarks/invalid.py
      - name: Verify invalid-ZPL report
        run: benchmarks/_work/venv/bin/python benchmarks/invalid.py --check
      - name: Exercise rendering conformance corpus
        id: conformance
        run: benchmarks/_work/venv/bin/python benchmarks/conformance.py --only codyps-zpl,labelary --include-invalid --output docs/benchmarks/conformance
      - name: Exercise external label examples
        run: benchmarks/_work/venv/bin/python benchmarks/conformance.py --corpus test-data/external-zpl --only all --output docs/benchmarks/external-zpl
      - name: Generate library and feature compatibility pages
        if: always() && steps.accuracy.outcome == 'success' && steps.conformance.outcome != 'skipped'
        run: python benchmarks/compatibility.py
      - name: Show tables in job summary
        if: always()
        run: |
          if test '${{ steps.measure.outcome }}' = success && test '${{ steps.accuracy.outcome }}' = success; then
            echo "Download the zpl-library-comparison artifact for this run's complete Markdown, plots, images and raw samples." >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          from pathlib import Path
          text = Path('docs/benchmarks/README.md').read_text()
          text += '\n' + Path('docs/benchmarks/accuracy/README.md').read_text().split('## Per-case accuracy')[0]
          text = '\n'.join(line for line in text.splitlines() if not line.startswith('!['))
          print(re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', text))
          PY
          else
            echo 'Benchmark did not complete. Checked-in baseline is not a result of this CI run; inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.measure.outcome == 'success' && steps.accuracy.outcome == 'success'
        with:
          name: zpl-library-comparison
          path: |
            docs/benchmarks/
            docs/compatibility/
            benchmarks/accuracy/reference/
            references/barcodes-zd621-v1/
            test-data/invalid-zpl/
            test-data/external-zpl/
            benchmarks/invalid/README.md
      - name: Fail on invalid-ZPL probe execution failures
        if: always() && steps.invalid.outcome == 'failure'
        run: exit 1
      - name: Fail on adapter errors after preserving the report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('docs/benchmarks/results.json').read_text())
          failed = [r for r in results['results'] if r['status'] != 'ok']
          if failed:
              raise SystemExit(f'{len(failed)} benchmark cells failed; see the uploaded report')
          PY
