name: Cache diagnostics

on:
  workflow_dispatch:
    inputs:
      invocations:
        description: Comma-separated BuildBuddy invocation UUIDs
        type: string
        required: true
      mnemonic:
        description: Assembly action type (Stage is for historical builds)
        type: choice
        options: ['ZplArchive', 'ZplStage']
        default: ZplArchive

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read BuildBuddy cache metadata
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          INVOCATIONS: ${{ inputs.invocations }}
          MNEMONIC: ${{ inputs.mnemonic }}
        run: python3 .github/scripts/buildbuddy_diagnostics.py --invocations "$INVOCATIONS" --mnemonic "$MNEMONIC" --output "$RUNNER_TEMP/cache-diagnostics"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-diagnostics
          path: ${{ runner.temp }}/cache-diagnostics
          retention-days: 7
